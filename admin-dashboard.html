<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Admin Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; 
            color: #f5f5dc; 
            margin: 0; 
            padding: 0; 
        }
        .header {
            background-color: #242424;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .header img { max-height: 50px; border-radius: 4px; }
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover { background-color: #c0392b; }
        
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        h2 { border-bottom: 2px solid #2ecc71; padding-bottom: 10px; display: inline-block; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #242424;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #2ecc71;
            cursor: pointer;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h3 { margin: 10px 0; color: #2ecc71; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <div>
            <span id="welcomeMsg" style="margin-right: 15px;">Loading...</span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="container">
        <h2>Admin Panel</h2>
        
        <div class="grid">
            <!-- Yeh link karega Employees form page par -->
            <div class="card" onclick="window.location.href='admin-employees.html'">
                <h3>👥 Manage Employees</h3>
                <p>Add, edit or view employee details.</p>
            </div>
            <div class="card" onclick="alert('Feature coming next!')">
                <h3>⏱️ Attendance & Tracker</h3>
                <p>View daily login, logout & net time.</p>
            </div>
            <div class="card" onclick="alert('Feature coming next!')">
                <h3>📅 Leave Approvals</h3>
                <p>Approve or reject leave requests.</p>
            </div>
            <div class="card" onclick="alert('Feature coming next!')">
                <h3>💰 Salary Sheet</h3>
                <p>Auto-calculated month-end salary.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('welcomeMsg').innerText = "Welcome, Admin";
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
