<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Notifications</title>
    <!-- PWA & iPhone (iOS) Support Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HireYourVA">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5dc; margin: 0; padding: 0; font-size: 15px; }
        .header { background-color: #242424; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header img { max-height: 40px; border-radius: 4px; }
        .btn-back { background-color: #555; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 13px; }
        .btn-back:hover { background-color: #777; }
        
        .container { padding: 20px; max-width: 600px; margin: 20px auto; }
        .card { background: #242424; padding: 20px; border-radius: 10px; border-top: 4px solid #3498db; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2 { margin-top: 0; color: #3498db; font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        .notif-card-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #f39c12; }
        .notif-card-item.approved { border-left-color: #2ecc71; }
        .notif-card-item.rejected { border-left-color: #e74c3c; }
        .notif-card-item p { margin: 5px 0; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <a href="employee-dashboard.html" class="btn-back">Back to Dashboard</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>Notifications & Updates</h2>
            <div id="fullNotifList">
                <p style="color: #aaa; text-align: center;">Loading notifications...</p>
            </div>
        </div>
    </div>

    <script>
        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered Successfully"))
                .catch((err) => console.log("Service Worker Registration Failed", err));
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                fetchFullNotifications(user.uid);
            }
        });

        async function fetchFullNotifications(uid) {
            const listDiv = document.getElementById('fullNotifList');
            try {
                const q = query(collection(db, "leaves"), where("uid", "==", uid));
                const snap = await getDocs(q);
                
                let updates = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    if(data.status === "APPROVED" || data.status === "REJECTED" || data.status === "PENDING") {
                        updates.push(data);
                    }
                });

                if (updates.length === 0) {
                    listDiv.innerHTML = "<p style='color: #aaa; text-align: center;'>No notifications yet.</p>";
                    return;
                }

                let html = "";
                updates.forEach(item => {
                    const statusColor = item.status === "APPROVED" ? "#2ecc71" : (item.status === "REJECTED" ? "#e74c3c" : "#f39c12");
                    const itemClass = item.status === "APPROVED" ? "approved" : (item.status === "REJECTED" ? "rejected" : "");
                    
                    html += `
                        <div class="notif-card-item ${itemClass}">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <strong style="color: #fff; font-size: 15px;">Leave Request (${item.leaveType})</strong>
                                <span style="font-weight: bold; color: ${statusColor}; font-size: 13px;">${item.status}</span>
                            </div>
                            <p><strong>Duration:</strong> ${item.fromDate} to ${item.toDate}</p>
                            <p><strong>Reason:</strong> ${item.reason}</p>
                        </div>
                    `;
                });

                listDiv.innerHTML = html;
            } catch (e) {
                listDiv.innerHTML = "<p style='color: red; text-align: center;'>Error loading notifications.</p>";
            }
        }
    </script>
</body>
</html>
