<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Salary Sheet</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5dc; margin: 0; padding: 0; }
        .header { background-color: #242424; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header img { max-height: 40px; border-radius: 4px; }
        .btn-back { background-color: #555; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        
        .container { padding: 20px; max-width: 900px; margin: 20px auto; }
        
        .controls { background: #242424; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; border-left: 5px solid #3498db; }
        .controls label { font-weight: bold; color: #aaa; }
        .controls input { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; font-family: inherit; font-size: 16px; }
        .controls button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; }
        
        .salary-card { background: #242424; padding: 20px; border-radius: 8px; border-top: 4px solid #f39c12; }
        .salary-card h3 { margin: 0 0 5px 0; color: #f39c12; }
        .salary-card hr { border: 0; border-top: 1px solid #333; margin: 15px 0; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .stat-row span { color: #aaa; }
        .stat-row strong { color: #fff; }
        
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #1a1a1a; padding: 8px 12px; border-radius: 4px; }
        .input-row input { width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; text-align: center; font-weight: bold; }
        
        .final-salary { font-size: 26px; font-weight: bold; color: #2ecc71; text-align: center; margin-top: 15px; background: #111; padding: 10px; border-radius: 6px; border: 1px solid #2ecc71; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <a href="admin-dashboard.html" class="btn-back">Back to Dashboard</a>
    </div>

    <div class="container">
        <div class="controls">
            <div>
                <label>Select Month & Year:</label><br>
                <input type="month" id="monthFilter">
            </div>
            <div style="margin-top: 20px;">
                <button id="generateBtn">Calculate Payroll</button>
            </div>
        </div>

        <div id="loadingMsg" style="text-align: center; color: #aaa; display: none;">Fetching attendance, leaves & holidays...</div>
        <div class="grid" id="salaryGrid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let allEmployees = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.href = "index.html";
            else {
                const today = new Date();
                const monthStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
                document.getElementById('monthFilter').value = monthStr;
                await fetchAllEmployees();
            }
        });

        async function fetchAllEmployees() {
            try {
                const q = query(collection(db, "employees"), where("role", "==", "EMPLOYEE"));
                const snap = await getDocs(q);
                snap.forEach(doc => {
                    allEmployees.push({ id: doc.id, ...doc.data() });
                });
            } catch(e) { console.error(e); }
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            const selectedMonth = document.getElementById('monthFilter').value;
            if(!selectedMonth) return alert("Please select a month!");
            generateSalaryData(selectedMonth);
        });

        async function generateSalaryData(monthStr) {
            const grid = document.getElementById('salaryGrid');
            const loading = document.getElementById('loadingMsg');
            
            grid.innerHTML = "";
            loading.style.display = "block";
            
            const [year, month] = monthStr.split('-');
            const daysInMonth = new Date(year, month, 0).getDate();
            const startDate = `${monthStr}-01`;
            const endDate = `${monthStr}-${daysInMonth}`;

            // Step 1: Count Weekends (Saturdays and Sundays) 5-Days Working Rule
            let weekendsCount = 0;
            for (let i = 1; i <= daysInMonth; i++) {
                let d = new Date(year, month - 1, i);
                if (d.getDay() === 0 || d.getDay() === 6) weekendsCount++; // 0=Sun, 6=Sat
            }

            try {
                // Step 2: Fetch Attendance & Calculate Half Day Penalties
                const attQ = query(collection(db, "attendance"), where("date", ">=", startDate), where("date", "<=", endDate));
                const attSnap = await getDocs(attQ);
                let attCountMap = {};
                let penaltyMap = {}; // User UID -> count of 0.5 penalties

                attSnap.forEach(doc => {
                    const data = doc.data();
                    if(data.status === "COMPLETED" || data.status === "WORKING") {
                        attCountMap[data.userId] = (attCountMap[data.userId] || 0) + 1;
                        
                        // If marked late and admin didn't revoke it, add 0.5 days penalty
                        if(data.halfDayMarked && !data.adminRevokedLate) {
                            penaltyMap[data.userId] = (penaltyMap[data.userId] || 0) + 0.5;
                        }
                    }
                });

                // Step 3: Fetch Leaves
                const leaveSnap = await getDocs(collection(db, "leaves"));
                let leaveCountMap = {};
                leaveSnap.forEach(doc => {
                    const data = doc.data();
                    if(data.status === "APPROVED" && data.fromDate.startsWith(monthStr)) {
                        leaveCountMap[data.uid] = (leaveCountMap[data.uid] || 0) + data.totalDays;
                    }
                });

                // Step 4: Fetch Company Holidays (Exclude weekends from counting double)
                const holQ = query(collection(db, "holidays"), where("date", ">=", startDate), where("date", "<=", endDate));
                const holSnap = await getDocs(holQ);
                let holidaysCount = 0;
                holSnap.forEach(doc => {
                    let holDate = new Date(doc.data().date);
                    if(holDate.getDay() !== 0 && holDate.getDay() !== 6) { 
                        holidaysCount++;
                    }
                });

                loading.style.display = "none";

                allEmployees.forEach(emp => {
                    const baseSalary = emp.baseSalary || 0;
                    const presentDays = attCountMap[emp.id] || 0;
                    const halfDayPenalties = penaltyMap[emp.id] || 0;
                    const approvedLeaves = leaveCountMap[emp.id] || 0;
                    
                    const displayName = (emp.name && emp.name !== "undefined") ? emp.name : (emp.email || "Unknown Employee");

                    // AUTO LOP CALCULATION 
                    // Missing Days = Total Month - (Present + Leaves + Weekends + Holidays)
                    let autoLop = daysInMonth - (presentDays + approvedLeaves + weekendsCount + holidaysCount);
                    if (autoLop < 0) autoLop = 0; 
                    
                    // Add half-day late penalties to the Unpaid Days
                    autoLop += halfDayPenalties;
                    
                    const card = document.createElement('div');
                    card.className = "salary-card";

                    card.innerHTML = `
                        <h3>${displayName}</h3>
                        <div class="stat-row"><span>Base Salary:</span> <strong>₹${baseSalary.toLocaleString()}</strong></div>
                        <div class="stat-row"><span>Days in Month:</span> <strong>${daysInMonth} Days</strong></div>
                        <hr>
                        <div class="stat-row"><span>Total Present (Punched In):</span> <strong style="color:#2ecc71;">${presentDays} Days</strong></div>
                        <div class="stat-row"><span>Approved Leaves (Paid):</span> <strong>${approvedLeaves} Days</strong></div>
                        <div class="stat-row"><span>Weekends (Sat/Sun Paid):</span> <strong>${weekendsCount} Days</strong></div>
                        <div class="stat-row"><span>Company Holidays (Paid):</span> <strong>${holidaysCount} Days</strong></div>
                        ${halfDayPenalties > 0 ? `<div class="stat-row" style="color:#e74c3c;"><span>Late Penalty Deductions:</span> <strong>${halfDayPenalties} Days</strong></div>` : ""}
                        
                        <div class="input-row" style="margin-top: 15px; border-left: 3px solid #e74c3c;">
                            <span style="color: #e74c3c; font-weight: bold;">Unpaid Days (Auto LOP):</span>
                            <input type="number" step="0.5" id="lop_${emp.id}" value="${autoLop}" min="0" onchange="calculateNet('${emp.id}', ${baseSalary}, ${daysInMonth})">
                        </div>
                        <div class="input-row" style="border-left: 3px solid #f39c12;">
                            <span>Add Bonus / Allowance (₹):</span>
                            <input type="number" id="bonus_${emp.id}" value="0" min="0" onchange="calculateNet('${emp.id}', ${baseSalary}, ${daysInMonth})">
                        </div>
                        
                        <div class="final-salary" id="net_${emp.id}">
                            ₹${baseSalary.toLocaleString()}
                        </div>
                    `;
                    grid.appendChild(card);
                    
                    window.calculateNet(emp.id, baseSalary, daysInMonth);
                });

                if(allEmployees.length === 0) grid.innerHTML = "<p style='color: #aaa;'>No employees found.</p>";

            } catch (error) {
                loading.innerText = "Error calculating data: " + error.message;
            }
        }

        window.calculateNet = function(empId, baseSalary, daysInMonth) {
            const lopDays = Number(document.getElementById(`lop_${empId}`).value) || 0;
            const bonus = Number(document.getElementById(`bonus_${empId}`).value) || 0;
            
            const perDayPay = baseSalary / daysInMonth;
            const deductions = lopDays * perDayPay;
            
            let netSalary = baseSalary - deductions + bonus;
            if(netSalary < 0) netSalary = 0;
            
            document.getElementById(`net_${empId}`).innerText = `Net Pay: ₹${Math.round(netSalary).toLocaleString()}`;
        }
    </script>
</body>
</html>
