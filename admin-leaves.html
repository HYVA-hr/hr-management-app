<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Leave Approvals</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5dc; margin: 0; padding: 0; }
        .header { background-color: #242424; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header img { max-height: 40px; border-radius: 4px; }
        .btn-back { background-color: #555; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        
        .container { padding: 20px; max-width: 800px; margin: 20px auto; }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 10px; display: inline-block; color: #3498db; }
        .history-title { border-bottom: 2px solid #aaa; color: #aaa; margin-top: 40px; }
        
        .leave-card { background: #242424; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #f39c12; position: relative; }
        .leave-card h3 { margin: 0 0 5px 0; color: #fff; }
        .leave-card p { margin: 5px 0; color: #ccc; font-size: 14px; }
        
        .action-btns { margin-top: 15px; display: flex; gap: 10px; }
        .btn-approve { background: #2ecc71; color: #111; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-reject { background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-approve:hover { background: #27ae60; }
        .btn-reject:hover { background: #c0392b; }
        
        .status-badge { position: absolute; top: 20px; right: 20px; font-size: 12px; font-weight: bold; padding: 5px 10px; border-radius: 4px; background: #444; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <a href="admin-dashboard.html" class="btn-back">Back to Dashboard</a>
    </div>

    <div class="container">
        <!-- Pending Section -->
        <h2>Pending Leave Requests</h2>
        <div id="pendingLeavesList">
            <p style="text-align: center; color: #aaa;">Fetching pending leaves...</p>
        </div>

        <!-- History Section -->
        <h2 class="history-title">Leave History (Resolved)</h2>
        <div id="historyLeavesList">
            <p style="text-align: center; color: #aaa;">Fetching history...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security check
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                fetchLeaves();
            }
        });

        async function fetchLeaves() {
            const pendingList = document.getElementById('pendingLeavesList');
            const historyList = document.getElementById('historyLeavesList');
            
            try {
                // Fetch ALL leaves so we can split them into Pending and History
                const querySnapshot = await getDocs(collection(db, "leaves"));
                let allLeaves = [];
                
                for (const leaveDoc of querySnapshot.docs) {
                    const leave = leaveDoc.data();
                    leave.id = leaveDoc.id;
                    
                    // Fetch Employee Name with a solid fallback so 'undefined' doesn't show
                    let empName = "Unknown Employee";
                    try {
                        const empSnap = await getDoc(doc(db, "employees", leave.uid));
                        if(empSnap.exists()) {
                            const empData = empSnap.data();
                            empName = empData.name || empData.email || "Name not registered";
                        }
                    } catch(e) { console.log(e); }
                    
                    leave.empName = empName;
                    allLeaves.push(leave);
                }
                
                // Sort leaves by latest first
                allLeaves.sort((a, b) => (b.appliedAt || 0) - (a.appliedAt || 0));
                
                // Split arrays based on status
                const pending = allLeaves.filter(l => l.status === 'PENDING');
                const history = allLeaves.filter(l => l.status === 'APPROVED' || l.status === 'REJECTED');
                
                // RENDER PENDING LEAVES
                if (pending.length === 0) {
                    pendingList.innerHTML = "<p style='color: #aaa;'>No pending leave requests at the moment.</p>";
                } else {
                    pendingList.innerHTML = "";
                    pending.forEach(leave => {
                        const card = document.createElement('div');
                        card.className = "leave-card";
                        card.innerHTML = `
                            <div class="status-badge" style="color: #f39c12;">PENDING</div>
                            <h3>${leave.empName}</h3>
                            <p><strong>Type:</strong> ${leave.leaveType}</p>
                            <p><strong>Duration:</strong> ${leave.fromDate} to ${leave.toDate} (${leave.totalDays} Days)</p>
                            <p><strong>Reason:</strong> ${leave.reason}</p>
                            <div class="action-btns">
                                <button class="btn-approve" onclick="updateLeaveStatus('${leave.id}', 'APPROVED')">Approve</button>
                                <button class="btn-reject" onclick="updateLeaveStatus('${leave.id}', 'REJECTED')">Reject</button>
                            </div>
                        `;
                        pendingList.appendChild(card);
                    });
                }

                // RENDER HISTORY LEAVES
                if (history.length === 0) {
                    historyList.innerHTML = "<p style='color: #aaa;'>No leave history found.</p>";
                } else {
                    historyList.innerHTML = "";
                    history.forEach(leave => {
                        const isApproved = leave.status === 'APPROVED';
                        const badgeColor = isApproved ? '#2ecc71' : '#e74c3c';
                        const borderColor = isApproved ? '#2ecc71' : '#e74c3c';

                        const card = document.createElement('div');
                        card.className = "leave-card";
                        card.style.borderLeftColor = borderColor; // Green for Approved, Red for Rejected
                        card.innerHTML = `
                            <div class="status-badge" style="color: ${badgeColor};">${leave.status}</div>
                            <h3>${leave.empName}</h3>
                            <p><strong>Type:</strong> ${leave.leaveType}</p>
                            <p><strong>Duration:</strong> ${leave.fromDate} to ${leave.toDate} (${leave.totalDays} Days)</p>
                            <p><strong>Reason:</strong> ${leave.reason}</p>
                        `;
                        historyList.appendChild(card);
                    });
                }
                
            } catch (error) {
                pendingList.innerHTML = "<p style='color: #e74c3c;'>Error fetching leaves: " + error.message + "</p>";
                historyList.innerHTML = "";
            }
        }

        // Action Function (Approve/Reject)
        window.updateLeaveStatus = async function(leaveId, newStatus) {
            const confirmMsg = newStatus === 'APPROVED' ? "Are you sure you want to Approve this leave?" : "Are you sure you want to Reject this leave?";
            if (!confirm(confirmMsg)) return;

            try {
                await updateDoc(doc(db, "leaves", leaveId), {
                    status: newStatus,
                    actionTakenAt: Date.now()
                });
                fetchLeaves(); // Auto-refresh lists without reloading the page
            } catch (error) {
                alert("Error updating leave: " + error.message);
            }
        };
    </script>
</body>
</html>
