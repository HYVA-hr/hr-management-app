<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Leave Management</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5dc; margin: 0; padding: 0; }
        .header { background-color: #242424; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header img { max-height: 40px; border-radius: 4px; }
        .btn-back { background-color: #555; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        
        .container { padding: 20px; max-width: 500px; margin: 20px auto; }
        .card { background: #242424; padding: 20px; border-radius: 8px; border-top: 4px solid #3498db; margin-bottom: 20px; }
        h2 { margin-top: 0; color: #3498db; }
        
        .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 15px; }
        label { font-size: 13px; color: #aaa; margin-bottom: 5px; }
        input, select, textarea { padding: 10px; border: 1px solid #444; border-radius: 6px; background-color: #333; color: white; }
        
        button.submit-btn { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.submit-btn:hover { background-color: #2980b9; }
        #statusMsg { text-align: center; margin-top: 10px; font-weight: bold; }

        .leave-item { background: #333; padding: 15px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #aaa; }
        .leave-item.PENDING { border-left-color: #f39c12; }
        .leave-item.APPROVED { border-left-color: #2ecc71; }
        .leave-item.REJECTED { border-left-color: #e74c3c; }
        .status-badge { float: right; font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 4px; background: #444; }
        .PENDING .status-badge { color: #f39c12; }
        .APPROVED .status-badge { color: #2ecc71; }
        .REJECTED .status-badge { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <a href="employee-dashboard.html" class="btn-back">Back</a>
    </div>

    <div class="container">
        <!-- Apply Leave Form -->
        <div class="card">
            <h2>Apply for Leave</h2>
            <form id="leaveForm">
                <div class="input-group">
                    <label>Leave Type</label>
                    <select id="leaveType" required>
                        <option value="Casual Leave (CL)">Casual Leave (CL)</option>
                        <option value="Sick Leave (SL)">Sick Leave (SL)</option>
                        <option value="Paid Leave (PL)">Paid Leave (PL)</option>
                        <option value="Unpaid Leave (LOP)">Unpaid Leave (LOP)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;">
                        <label>From Date</label>
                        <input type="date" id="fromDate" required>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>To Date</label>
                        <input type="date" id="toDate" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Reason for Leave</label>
                    <textarea id="reason" rows="2" required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Submit Application</button>
                <div id="statusMsg"></div>
            </form>
        </div>

        <!-- Leave History -->
        <div class="card" style="border-top-color: #aaa;">
            <h2 style="color: #f5f5dc;">My Leave History</h2>
            <div id="leaveHistoryList">
                <p style="text-align: center; color: #aaa;">Loading...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loadLeaveHistory();
            } else {
                window.location.href = "index.html";
            }
        });

        // Submit Leave Form
        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');
            submitBtn.disabled = true;
            statusMsg.innerText = "Submitting...";
            statusMsg.style.color = "#f39c12";

            const fromDate = new Date(document.getElementById('fromDate').value);
            const toDate = new Date(document.getElementById('toDate').value);
            const diffTime = Math.abs(toDate - fromDate);
            const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

            if (toDate < fromDate) {
                statusMsg.innerText = "Error: 'To Date' cannot be before 'From Date'";
                statusMsg.style.color = "#e74c3c";
                submitBtn.disabled = false;
                return;
            }

            const leaveData = {
                uid: currentUser.uid,
                leaveType: document.getElementById('leaveType').value,
                fromDate: document.getElementById('fromDate').value,
                toDate: document.getElementById('toDate').value,
                totalDays: totalDays,
                reason: document.getElementById('reason').value,
                status: "PENDING",
                appliedAt: Date.now()
            };

            try {
                await addDoc(collection(db, "leaves"), leaveData);
                statusMsg.innerText = "Leave Applied Successfully!";
                statusMsg.style.color = "#2ecc71";
                document.getElementById('leaveForm').reset();
                loadLeaveHistory(); 
            } catch (error) {
                statusMsg.innerText = "Error: " + error.message;
                statusMsg.style.color = "#e74c3c";
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Load Leave History
        async function loadLeaveHistory() {
            const listDiv = document.getElementById('leaveHistoryList');
            try {
                const q = query(collection(db, "leaves"), where("uid", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                
                let leaves = [];
                querySnapshot.forEach((doc) => leaves.push(doc.data()));
                leaves.sort((a, b) => b.appliedAt - a.appliedAt);

                if (leaves.length === 0) {
                    listDiv.innerHTML = "<p style='text-align: center; color: #aaa;'>No leaves applied yet.</p>";
                    return;
                }

                listDiv.innerHTML = "";
                leaves.forEach(leave => {
                    const div = document.createElement('div');
                    div.className = `leave-item ${leave.status}`;
                    div.innerHTML = `
                        <span class="status-badge">${leave.status}</span>
                        <strong>${leave.leaveType}</strong><br>
                        <span style="font-size: 13px; color: #ccc;">${leave.fromDate} to ${leave.toDate} (${leave.totalDays} Days)</span><br>
                        <span style="font-size: 13px; color: #aaa;">Reason: ${leave.reason}</span>
                    `;
                    listDiv.appendChild(div);
                });
            } catch (error) {
                listDiv.innerHTML = "<p style='color: red;'>Failed to load history.</p>";
            }
        }
    </script>
</body>
</html>
