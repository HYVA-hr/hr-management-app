<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Employee Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #f5f5dc;
            margin: 0;
            padding: 0;
            font-size: 15px;
        }
        .header {
            background-color: #242424;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .header img {
            max-height: 45px;
            border-radius: 4px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #welcomeMsg {
            font-size: 14px;
            font-weight: 500;
            color: #f5f5dc;
            display: none;
        }
        @media(min-width: 500px) {
            #welcomeMsg {
                display: inline;
            }
        }
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background-color 0.3s;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
        
        /* Clean Notification Bell & Properly Positioned Dropdown */
        .notif-container {
            position: relative;
            cursor: pointer;
        }
        .notif-bell {
            font-size: 16px;
            background: #333;
            padding: 6px 10px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #444;
        }
        .notif-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #e74c3c;
            color: white;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 50%;
            font-weight: bold;
            display: none;
        }
        .notif-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            width: 250px;
            background: #242424;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 99999;
            max-height: 300px;
            overflow-y: auto;
        }
        .notif-header {
            padding: 10px 12px;
            border-bottom: 1px solid #333;
            font-weight: bold;
            color: #2ecc71;
            font-size: 13px;
        }
        .notif-item {
            padding: 10px 12px;
            border-bottom: 1px solid #333;
            font-size: 12px;
            color: #ccc;
        }
        .notif-item:hover {
            background: #2a2a2a;
        }

        /* Toast Popup Banner */
        #toastBanner {
            visibility: hidden;
            min-width: 260px;
            background-color: #3498db;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 12px 15px;
            position: fixed;
            z-index: 9999;
            right: 15px;
            bottom: 15px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            border-left: 5px solid #111;
        }
        #toastBanner.show {
            visibility: visible;
            animation: slidein 0.3s, fadeout 0.3s 3s;
        }
        @keyframes slidein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 15px; opacity: 1; }
        }
        @keyframes fadeout {
            from { bottom: 15px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }

        .container {
            padding: 25px 20px;
            max-width: 450px;
            margin: 30px auto;
            text-align: center;
            background: #242424;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            border-top: 4px solid #2ecc71;
        }
        h2 {
            font-size: 22px;
            margin-top: 0;
        }
        .time-display {
            font-size: 45px;
            font-weight: bold;
            color: #2ecc71;
            margin: 15px 0;
            letter-spacing: 1px;
        }
        .late-warning {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
            border: 1px solid #e74c3c;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        button.action-btn {
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-in { background-color: #2ecc71; color: #111; }
        .btn-break { background-color: #f39c12; color: #111; }
        .btn-out { background-color: #e74c3c; color: white; }
        .btn-leave { background-color: #3498db; color: white; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        
        .stats {
            margin-top: 25px;
            text-align: left;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2ecc71;
        }
        .stats p {
            margin: 8px 0;
            font-size: 14px;
        }
        
        #resetBtn {
            background: none;
            color: #3498db;
            border: none;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            font-size: 13px;
        }
        #locationStatus {
            color: #f39c12;
            font-size: 12px;
            margin-top: 6px;
            font-weight: bold;
            height: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <div class="header-right">
            <!-- Notification Bell Component -->
            <div class="notif-container" id="notifContainer">
                <div class="notif-bell">🔔</div>
                <span class="notif-badge" id="notifBadge">0</span>
                <div class="notif-dropdown" id="notifDropdown">
                    <div class="notif-header">Leave Updates</div>
                    <div id="notifList">
                        <div style="padding: 12px; text-align: center; color: #777;">No updates</div>
                    </div>
                </div>
            </div>

            <span id="welcomeMsg">Employee</span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- Toast Popup Banner Container -->
    <div id="toastBanner">Update received!</div>

    <div class="container">
        <h2>Daily Attendance</h2>
        <div class="late-warning" id="lateWarning">⚠️ HALF DAY MARKED (Punched after 5:30 PM)</div>
        <div class="time-display" id="netTimeDisplay">00:00:00</div>
        <p style="color: #aaa; font-size: 12px; margin-top: -10px;">NET WORKING TIME</p>
        
        <div id="locationStatus"></div>

        <div class="btn-group">
            <button id="clockInBtn" class="action-btn btn-in">Clock In</button>
            <button id="breakBtn" class="action-btn btn-break" disabled>Take Break (ON)</button>
            <button id="clockOutBtn" class="action-btn btn-out" disabled>Clock Out</button>
            <button onclick="window.location.href='employee-leaves.html'" class="action-btn btn-leave">📅 Apply / View Leaves</button>
        </div>

        <div class="stats">
            <p><strong>Status:</strong> <span id="currentStatus" style="color: #aaa;">Not Started</span></p>
            <p><strong>Clock In:</strong> <span id="clockInTime">--:--</span></p>
            <p><strong>Clock Out:</strong> <span id="clockOutTime">--:--</span></p>
            <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
            <p><strong>Total Break Time:</strong> <span id="totalBreakTime">00:00:00</span></p>
            <p><strong>Total Worked Time:</strong> <span id="totalWorkedTime">00:00:00</span></p>
        </div>
        
        <button id="resetBtn">Testing Only: Reset Today's Shift</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let attendanceDocId = "";
        let attData = { clockIn: null, clockOut: null, breaks: [], status: "OUT", halfDayMarked: false, adminRevokedLate: false };
        let timerInterval = null;

        const ui = {
            welcome: document.getElementById('welcomeMsg'),
            netTime: document.getElementById('netTimeDisplay'),
            clockInBtn: document.getElementById('clockInBtn'),
            breakBtn: document.getElementById('breakBtn'),
            clockOutBtn: document.getElementById('clockOutBtn'),
            status: document.getElementById('currentStatus'),
            inTime: document.getElementById('clockInTime'),
            outTime: document.getElementById('clockOutTime'),
            breakTime: document.getElementById('totalBreakTime'),
            workedTime: document.getElementById('totalWorkedTime'),
            resetBtn: document.getElementById('resetBtn'),
            lateWarning: document.getElementById('lateWarning'),
            locStatus: document.getElementById('locationStatus')
        };

        // Custom Web Audio API Chime Tone Generator
        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        // Toggle Notification Dropdown Panel
        const notifContainer = document.getElementById('notifContainer');
        const notifDropdown = document.getElementById('notifDropdown');
        
        notifContainer.addEventListener('click', (event) => {
            event.stopPropagation();
            notifDropdown.style.display = notifDropdown.style.display === 'block' ? 'none' : 'block';
        });

        window.addEventListener('click', () => {
            notifDropdown.style.display = 'none';
        });

        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function getYesterdayStr() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function formatTimeFromTimestamp(ms) {
            return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function msToHMS(ms) {
            const secs = Math.floor(ms / 1000);
            const h = String(Math.floor(secs / 3600)).padStart(2, '0');
            const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
            const s = String(secs % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function getUserLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ error: "Geolocation not supported" });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({ lat: position.coords.latitude, lng: position.coords.longitude });
                    },
                    (error) => {
                        resolve({ error: "Permission denied or failed" });
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "employees", user.uid));
                if (docSnap.exists() && docSnap.data().isActive === false) {
                    await signOut(auth);
                    alert("Your account has been terminated/blocked by Admin.");
                    window.location.href = "index.html";
                    return;
                }

                currentUser = user;
                ui.welcome.innerText = "Welcome, Employee";
                await loadAttendance();
                fetchEmployeeNotifications(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        async function fetchEmployeeNotifications(uid) {
            try {
                const q = query(collection(db, "leaves"), where("uid", "==", uid));
                const snap = await getDocs(q);
                const badge = document.getElementById('notifBadge');
                const list = document.getElementById('notifList');
                
                let resolvedCount = 0;
                let html = "";
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.status === "APPROVED" || data.status === "REJECTED") {
                        resolvedCount++;
                        const color = data.status === "APPROVED" ? "#2ecc71" : "#e74c3c";
                        html += `<div class="notif-item">Your leave (${data.fromDate}) was <strong style="color: ${color};">${data.status}</strong></div>`;
                    }
                });

                if (resolvedCount > 0) {
                    badge.innerText = resolvedCount;
                    badge.style.display = 'inline-block';
                    list.innerHTML = html;
                } else {
                    badge.style.display = 'none';
                    list.innerHTML = '<div style="padding: 12px; text-align: center; color: #777;">No updates</div>';
                }
            } catch (error) {
                console.error("Error fetching employee notifications:", error);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });

        async function loadAttendance() {
            const todayStr = getTodayStr();
            const yesterdayStr = getYesterdayStr();
            
            const yDocRef = doc(db, "attendance", `${currentUser.uid}_${yesterdayStr}`);
            const ySnap = await getDoc(yDocRef);
            
            if (ySnap.exists() && (ySnap.data().status === "WORKING" || ySnap.data().status === "ON_BREAK")) {
                attendanceDocId = `${currentUser.uid}_${yesterdayStr}`;
                attData = ySnap.data();
            } else {
                attendanceDocId = `${currentUser.uid}_${todayStr}`;
                const tSnap = await getDoc(doc(db, "attendance", attendanceDocId));
                if (tSnap.exists()) {
                    attData = tSnap.data();
                } else {
                    attData = { clockIn: null, clockOut: null, breaks: [], status: "OUT", halfDayMarked: false, adminRevokedLate: false };
                }
            }
            if (!attData.breaks) attData.breaks = [];
            updateUI();
        }

        function calcTimes() {
            if (!attData.clockIn) return { netMs: 0, breakMs: 0 };
            let breakMs = 0;
            attData.breaks.forEach(b => {
                const end = b.end || (attData.status === "ON_BREAK" ? Date.now() : b.start);
                breakMs += (end - b.start);
            });
            const endRef = attData.clockOut || Date.now();
            const netMs = Math.max(0, (endRef - attData.clockIn) - breakMs);
            return { netMs, breakMs };
        }

        function updateUI() {
            ui.resetBtn.style.display = "none";
            ui.lateWarning.style.display = (attData.halfDayMarked && !attData.adminRevokedLate) ? "block" : "none";

            if (attData.status === "WORKING") {
                ui.status.innerText = "Working"; ui.status.style.color = "#2ecc71";
                ui.clockInBtn.disabled = true; ui.breakBtn.disabled = false; ui.clockOutBtn.disabled = false;
                ui.breakBtn.innerText = "Take Break (ON)";
                startTimer();
            } else if (attData.status === "ON_BREAK") {
                ui.status.innerText = "On Break"; ui.status.style.color = "#f39c12";
                ui.clockInBtn.disabled = true; ui.breakBtn.disabled = false; ui.clockOutBtn.disabled = true;
                ui.breakBtn.innerText = "Resume Work (OFF)";
                startTimer(); 
            } else if (attData.status === "COMPLETED") {
                ui.status.innerText = "Shift Ended"; ui.status.style.color = "#e74c3c";
                ui.clockInBtn.disabled = true; ui.breakBtn.disabled = true; ui.clockOutBtn.disabled = true;
                ui.resetBtn.style.display = "inline-block"; 
                clearInterval(timerInterval);
                renderStaticTimes();
            } else {
                ui.status.innerText = "Not Started"; ui.status.style.color = "#aaa";
                ui.clockInBtn.disabled = false; ui.breakBtn.disabled = true; ui.clockOutBtn.disabled = true;
                ui.inTime.innerText = "--:--"; ui.outTime.innerText = "--:--";
                ui.netTime.innerText = "00:00:00"; ui.breakTime.innerText = "00:00:00"; ui.workedTime.innerText = "00:00:00";
            }

            if (attData.clockIn) ui.inTime.innerText = formatTimeFromTimestamp(attData.clockIn);
            if (attData.clockOut) ui.outTime.innerText = formatTimeFromTimestamp(attData.clockOut);
        }

        function renderStaticTimes() {
            const { netMs, breakMs } = calcTimes();
            ui.netTime.innerText = msToHMS(netMs);
            ui.workedTime.innerText = msToHMS(netMs);
            ui.breakTime.innerText = msToHMS(breakMs);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(renderStaticTimes, 1000);
            renderStaticTimes();
        }

        ui.clockInBtn.addEventListener('click', async () => {
            ui.locStatus.innerText = "Fetching GPS Location...";
            ui.clockInBtn.disabled = true;
            
            const locationData = await getUserLocation();
            ui.locStatus.innerText = "";

            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            let isLate = false;
            if (h > 17 || (h === 17 && m > 30) || h < 12) {
                isLate = true;
            }

            attData = { 
                clockIn: Date.now(), 
                clockOut: null, 
                breaks: [], 
                status: "WORKING", 
                userId: currentUser.uid, 
                date: getTodayStr(),
                halfDayMarked: isLate,
                adminRevokedLate: false,
                inLocation: locationData
            };
            await setDoc(doc(db, "attendance", attendanceDocId), attData);
            updateUI();
        });

        ui.breakBtn.addEventListener('click', async () => {
            if (attData.status === "WORKING") {
                attData.status = "ON_BREAK";
                attData.breaks.push({ start: Date.now(), end: null });
            } else if (attData.status === "ON_BREAK") {
                attData.status = "WORKING";
                attData.breaks[attData.breaks.length - 1].end = Date.now();
            }
            await updateDoc(doc(db, "attendance", attendanceDocId), { status: attData.status, breaks: attData.breaks });
            updateUI();
        });

        ui.clockOutBtn.addEventListener('click', async () => {
            if (confirm("Are you sure you want to clock out?")) {
                ui.locStatus.innerText = "Fetching GPS Location...";
                ui.clockOutBtn.disabled = true;

                const locationData = await getUserLocation();
                ui.locStatus.innerText = "";

                attData.status = "COMPLETED";
                attData.clockOut = Date.now();
                const { netMs, breakMs } = calcTimes();
                
                await updateDoc(doc(db, "attendance", attendanceDocId), { 
                    status: attData.status, 
                    clockOut: attData.clockOut,
                    netMinutes: Math.floor(netMs / 60000), 
                    totalBreakMinutes: Math.floor(breakMs / 60000),
                    outLocation: locationData
                });
                updateUI();
            }
        });

        ui.resetBtn.addEventListener('click', async () => {
            if (confirm("TESTING: Delete today's attendance and start over?")) {
                await deleteDoc(doc(db, "attendance", attendanceDocId));
                attData = { clockIn: null, clockOut: null, breaks: [], status: "OUT", halfDayMarked: false };
                updateUI();
            }
        });
    </script>
</body>
</html>
