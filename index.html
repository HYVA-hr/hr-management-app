<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Login</title>
    <style>
        /* Dark Theme based on your Logo */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #1a1a1a; /* Dark background */
            margin: 0; 
            color: #f5f5dc; /* Cream text */
        }
        .login-container { 
            background: #242424; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 350px; 
            text-align: center;
        }
        .logo-box img {
            max-width: 150px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        h2 { margin-bottom: 25px; font-weight: normal; letter-spacing: 1px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #444; 
            border-radius: 6px; 
            box-sizing: border-box; 
            background-color: #333;
            color: white;
        }
        input::placeholder { color: #aaa; }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2ecc71; /* Green accent from logo */
            color: #111; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background-color: #27ae60; }
        #error-message { color: #ff6b6b; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo Image -->
        <div class="logo-box">
            <img src="logo.png" alt="Hire Your VA Logo" onerror="this.style.display='none'">
        </div>
        
        <h2>HR PORTAL</h2>
        <input type="email" id="email" placeholder="Email ID" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="loginBtn">Secure Login</button>
        <div id="error-message"></div>
    </div>

    <!-- Firebase Scripts (Logic hum next step me add karenge) -->
    <script type="module">
        // Yahani Firebase ka database aur login link hoga
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(email && password) {
                document.getElementById('error-message').innerText = "Connecting to database... (Database link pending)";
            } else {
                document.getElementById('error-message').innerText = "Please enter email and password";
            }
        });
    </script>
</body>
</html>
