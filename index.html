<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #1a1a1a; 
            margin: 0; 
            color: #f5f5dc; 
        }
        .login-container { 
            background: #242424; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 350px; 
            text-align: center;
        }
        .logo-box img {
            max-width: 150px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        h2 { margin-bottom: 25px; font-weight: normal; letter-spacing: 1px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #444; 
            border-radius: 6px; 
            box-sizing: border-box; 
            background-color: #333;
            color: white;
        }
        input::placeholder { color: #aaa; }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2ecc71; 
            color: #111; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background-color: #27ae60; }
        #error-message { color: #ff6b6b; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-box">
            <img src="logo.png" alt="Hire Your VA Logo" onerror="this.style.display='none'">
        </div>
        
        <h2>HR PORTAL</h2>
        <input type="email" id="email" placeholder="Email ID" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="loginBtn">Secure Login</button>
        <div id="error-message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Aapki update ki hui Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1",
            measurementId: "G-PFKWP58KL5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            if (!email || !password) {
                errorDiv.innerText = "Please enter both email and password.";
                return;
            }

            errorDiv.innerText = "Authenticating...";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDoc = await getDoc(doc(db, "employees", user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === "ADMIN") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "employee-dashboard.html";
                    }
                } else {
                    errorDiv.innerText = "User profile not found in the database.";
                }
            } catch (error) {
                errorDiv.innerText = "Login failed: " + error.message;
            }
        });
    </script>
</body>
</html>
