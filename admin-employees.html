<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Manage Employees</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5dc; margin: 0; padding: 0; font-size: 15px; }
        .header { background-color: #242424; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header img { max-height: 45px; border-radius: 4px; }
        .btn-back { background-color: #555; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-back:hover { background-color: #777; }
        
        .container { padding: 15px; max-width: 800px; margin: 10px auto; }
        .card { background: #242424; padding: 20px; border-radius: 10px; border-top: 4px solid #2ecc71; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2 { margin-top: 0; color: #2ecc71; font-size: 20px; border-bottom: 2px solid #333; padding-bottom: 8px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; gap: 10px; } }
        
        .input-group { display: flex; flex-direction: column; text-align: left; }
        label { font-size: 13px; color: #aaa; margin-bottom: 4px; font-weight: 500; }
        input, select, textarea { padding: 10px; border: 1px solid #444; border-radius: 6px; background-color: #333; color: white; font-size: 14px; width: 100%; box-sizing: border-box; }
        
        button.submit-btn { width: 100%; padding: 12px; background-color: #2ecc71; color: #111; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button.submit-btn:hover { background-color: #27ae60; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #statusMsg { text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; }
        
        .section-title { grid-column: 1 / -1; margin-top: 8px; color: #2ecc71; border-bottom: 1px solid #444; padding-bottom: 4px; font-size: 15px; font-weight: bold; }
        
        /* Employee List Grid */
        .emp-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 15px; }
        .emp-item { background: #1a1a1a; padding: 12px; border-radius: 8px; border-left: 4px solid #2ecc71; position: relative; }
        .emp-item.blocked { border-left-color: #e74c3c; opacity: 0.7; }
        .emp-item h4 { margin: 0 0 4px 0; color: #fff; font-size: 15px; }
        .emp-item p { margin: 2px 0; font-size: 12px; color: #aaa; }
        .btn-toggle { width: 100%; margin-top: 8px; padding: 6px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-block { background: #e74c3c; color: white; }
        .btn-unblock { background: #2ecc71; color: #111; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <a href="admin-dashboard.html" class="btn-back">Back to Dashboard</a>
    </div>

    <div class="container">
        <!-- Add Employee Form Card -->
        <div class="card">
            <h2>Add New Employee</h2>
            <p style="font-size: 12px; color: #aaa; margin-top: -4px; margin-bottom: 15px;">
                Create login credentials and save profile automatically.
            </p>
            
            <form id="addEmployeeForm">
                <div class="form-grid">
                    <div class="section-title">Login Credentials</div>
                    <div class="input-group">
                        <label>Email ID (For Login)</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input-group">
                        <label>Set Temporary Password</label>
                        <input type="text" id="password" placeholder="Min 6 characters" required minlength="6">
                    </div>

                    <div class="section-title">Work & Profile Details</div>
                    <div class="input-group">
                        <label>Employee ID</label>
                        <input type="text" id="empId" placeholder="e.g., HYVA-001" required>
                    </div>
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone" required>
                    </div>
                    <div class="input-group">
                        <label>Department</label>
                        <input type="text" id="department" required>
                    </div>
                    <div class="input-group">
                        <label>Designation</label>
                        <input type="text" id="designation" required>
                    </div>
                    <div class="input-group">
                        <label>Base Monthly Salary (₹)</label>
                        <input type="number" id="salary" required>
                    </div>
                    <div class="input-group">
                        <label>Date of Birth (DOB)</label>
                        <input type="date" id="dob" required>
                    </div>
                    <div class="input-group">
                        <label>Date of Joining (DOJ)</label>
                        <input type="date" id="doj" required>
                    </div>
                </div>
                
                <div class="input-group" style="margin-top: 12px;">
                    <label>Full Address</label>
                    <textarea id="address" rows="2" required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Create Employee Account</button>
                <div id="statusMsg"></div>
            </form>
        </div>

        <!-- Existing Employees Directory & Block Controls -->
        <div class="card" style="border-top-color: #3498db;">
            <h2 style="color: #3498db; font-size: 20px;">Active & Terminated Employees</h2>
            <div id="employeesDirectory">
                <p style="color: #aaa; text-align: center;">Loading directory...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDocs, collection, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const mainApp = initializeApp(firebaseConfig);
        const db = getFirestore(mainApp);
        const mainAuth = getAuth(mainApp);

        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        onAuthStateChanged(mainAuth, (user) => {
            if (!user) window.location.href = "index.html";
            else fetchEmployeesDirectory();
        });

        async function fetchEmployeesDirectory() {
            const directoryDiv = document.getElementById('employeesDirectory');
            try {
                const querySnapshot = await getDocs(collection(db, "employees"));
                let html = '<div class="emp-list-grid">';
                
                let count = 0;
                querySnapshot.forEach((docSnap) => {
                    const emp = docSnap.data();
                    if(emp.role === "ADMIN") return;
                    count++;
                    
                    const isActive = emp.isActive !== false;
                    const statusClass = isActive ? "" : "blocked";
                    const btnClass = isActive ? "btn-block" : "btn-unblock";
                    const btnText = isActive ? "Terminate / Block" : "Unblock / Restore";
                    const statusText = isActive ? '<span style="color:#2ecc71;">● Active</span>' : '<span style="color:#e74c3c;">● Terminated</span>';

                    html += `
                        <div class="emp-item ${statusClass}">
                            <h4>${emp.name || emp.email}</h4>
                            <p><strong>ID:</strong> ${emp.employeeId || 'N/A'}</p>
                            <p><strong>Dept:</strong> ${emp.department || 'N/A'}</p>
                            <p>Status: ${statusText}</p>
                            <button class="btn-toggle ${btnClass}" onclick="toggleEmployeeStatus('${docSnap.id}', ${isActive})">${btnText}</button>
                        </div>
                    `;
                });

                if(count === 0) {
                    directoryDiv.innerHTML = "<p style='color: #aaa; text-align: center;'>No employees found.</p>";
                } else {
                    html += '</div>';
                    directoryDiv.innerHTML = html;
                }
            } catch (e) {
                directoryDiv.innerHTML = "<p style='color: #e74c3c;'>Error loading directory.</p>";
            }
        }

        window.toggleEmployeeStatus = async function(uid, currentStatus) {
            const actionName = currentStatus ? "terminate/block" : "restore/unblock";
            if(!confirm(`Are you sure you want to ${actionName} this employee?`)) return;

            try {
                await updateDoc(doc(db, "employees", uid), {
                    isActive: !currentStatus
                });
                alert(`Employee successfully ${currentStatus ? 'blocked' : 'restored'}!`);
                fetchEmployeesDirectory();
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            statusMsg.innerText = "Creating Employee Account & Saving Profile...";
            statusMsg.style.color = "#f39c12";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const userCredential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                const newUserId = userCredential.user.uid;

                const employeeData = {
                    role: "EMPLOYEE",
                    isActive: true,
                    employeeId: document.getElementById('empId').value,
                    name: document.getElementById('name').value,
                    email: email,
                    phone: document.getElementById('phone').value,
                    department: document.getElementById('department').value,
                    designation: document.getElementById('designation').value,
                    baseSalary: Number(document.getElementById('salary').value),
                    dob: document.getElementById('dob').value,
                    doj: document.getElementById('doj').value,
                    address: document.getElementById('address').value,
                    createdAt: Date.now()
                };

                await setDoc(doc(db, "employees", newUserId), employeeData);
                await signOut(secondaryAuth);

                statusMsg.innerText = "Employee Added Successfully!";
                statusMsg.style.color = "#2ecc71";
                document.getElementById('addEmployeeForm').reset();
                fetchEmployeesDirectory();
            } catch (error) {
                statusMsg.innerText = "Error: " + error.message;
                statusMsg.style.color = "#e74c3c";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
