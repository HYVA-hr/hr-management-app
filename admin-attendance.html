<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIRE YOUR VA - Attendance Tracker</title>
    <!-- PWA & iPhone (iOS) Support Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HireYourVA">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #f5f5dc; margin: 0; padding: 0; }
        .header { background-color: #242424; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header img { max-height: 40px; border-radius: 4px; }
        .btn-back { background-color: #555; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        
        .container { padding: 20px; max-width: 900px; margin: 20px auto; }
        
        .controls { background: #242424; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #2ecc71; }
        .controls label { font-weight: bold; margin-right: 10px; color: #aaa; }
        .controls input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; font-family: inherit; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        
        .emp-card { background: #242424; padding: 20px; border-radius: 8px; border-top: 4px solid #555; position: relative; }
        .emp-card h3 { margin: 0 0 10px 0; color: #2ecc71; }
        .emp-card p { margin: 8px 0; font-size: 14px; color: #ccc; display: flex; justify-content: space-between; align-items: center;}
        .emp-card hr { border: 0; border-top: 1px solid #333; margin: 10px 0; }
        
        .status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.WORKING { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .status.ON_BREAK { background: rgba(243, 156, 18, 0.2); color: #f39c12; }
        .status.COMPLETED { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .status.ABSENT { background: rgba(170, 170, 170, 0.2); color: #aaa; }

        .late-tag { background: #e74c3c; color: white; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 10px; }
        .btn-revoke { background: transparent; color: #3498db; border: 1px solid #3498db; padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; display: block; margin-top: 10px; }
        .btn-revoke:hover { background: #3498db; color: white; }

        .map-link { color: #3498db; text-decoration: none; font-size: 12px; border: 1px solid #3498db; padding: 2px 6px; border-radius: 4px; background: rgba(52,152,219,0.1); }
        .map-link:hover { background: #3498db; color: white; }
        .loc-error { color: #e74c3c; font-size: 11px; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Hire Your VA" onerror="this.style.display='none'">
        <a href="admin-dashboard.html" class="btn-back">Back to Dashboard</a>
    </div>

    <div class="container">
        <div class="controls">
            <div>
                <label>Select Date:</label>
                <input type="date" id="dateFilter">
            </div>
            <div style="color: #2ecc71; font-weight: bold;" id="totalCount">Total Records: 0</div>
        </div>

        <div id="loadingMsg" style="text-align: center; color: #aaa;">Fetching attendance data...</div>
        <div class="grid" id="attendanceGrid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw8NhVWaoMbm-CiED4M_K02wOSRtV2LUc",
            authDomain: "hire-your-va-hr.firebaseapp.com",
            projectId: "hire-your-va-hr",
            storageBucket: "hire-your-va-hr.firebasestorage.app",
            messagingSenderId: "75356368308",
            appId: "1:75356368308:web:be5c4cfaa62c72efced6e1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let allEmployees = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                document.getElementById('dateFilter').value = todayStr;
                
                await fetchAllEmployees();
                fetchAttendance(todayStr);
            }
        });

        document.getElementById('dateFilter').addEventListener('change', (e) => {
            fetchAttendance(e.target.value);
        });

        async function fetchAllEmployees() {
            try {
                allEmployees = [];
                const q = query(collection(db, "employees"), where("role", "==", "EMPLOYEE"));
                const snap = await getDocs(q);
                snap.forEach(doc => {
                    allEmployees.push({ id: doc.id, ...doc.data() });
                });
            } catch(e) { console.error(e); }
        }

        function formatTime(timestamp) {
            if(!timestamp) return "--:--";
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Help format Map Link
        function getMapLink(locData) {
            if(!locData) return `<span class="loc-error">No GPS</span>`;
            if(locData.error) return `<span class="loc-error">GPS Blocked</span>`;
            return `<a href="https://www.google.com/maps?q=${locData.lat},${locData.lng}" target="_blank" class="map-link">📍 Map</a>`;
        }

        window.revokeHalfDay = async function(userId, dateStr) {
            if(confirm("Revoke Half-Day penalty? This will give the employee full salary for this day.")) {
                try {
                    await updateDoc(doc(db, "attendance", `${userId}_${dateStr}`), {
                        adminRevokedLate: true
                    });
                    fetchAttendance(dateStr); 
                } catch (e) {
                    alert("Error: " + e.message);
                }
            }
        }

        async function fetchAttendance(dateString) {
            const grid = document.getElementById('attendanceGrid');
            const loading = document.getElementById('loadingMsg');
            const totalCount = document.getElementById('totalCount');
            
            grid.innerHTML = "";
            loading.style.display = "block";
            
            try {
                const q = query(collection(db, "attendance"), where("date", "==", dateString));
                const attSnap = await getDocs(q);
                
                let attendanceMap = {};
                attSnap.forEach(doc => {
                    let data = doc.data();
                    attendanceMap[data.userId] = data;
                });

                loading.style.display = "none";
                totalCount.innerText = `Total Employees: ${allEmployees.length}`;

                allEmployees.forEach(emp => {
                    const att = attendanceMap[emp.id];
                    let status = "ABSENT / NOT PUNCHED";
                    let statusClass = "ABSENT";
                    let inTime = "--:--";
                    let outTime = "--:--";
                    let netTime = "0 mins";
                    let breakTime = "0 mins";
                    let lateWarningHtml = "";
                    let inLocHtml = "";
                    let outLocHtml = "";

                    if(att) {
                        status = att.status;
                        statusClass = att.status;
                        inTime = formatTime(att.clockIn);
                        outTime = formatTime(att.clockOut);
                        
                        // Render Maps Links
                        if(att.clockIn) inLocHtml = getMapLink(att.inLocation);
                        if(att.clockOut) outLocHtml = getMapLink(att.outLocation);
                        
                        if(att.halfDayMarked) {
                            if(att.adminRevokedLate) {
                                lateWarningHtml = `<span style="color:#2ecc71; font-size:11px; margin-left:10px;">✅ Penalty Revoked</span>`;
                            } else {
                                lateWarningHtml = `<span class="late-tag">HALF DAY (LATE)</span>
                                <button class="btn-revoke" onclick="revokeHalfDay('${emp.id}', '${dateString}')">Revoke Penalty</button>`;
                            }
                        }

                        if (att.status === "COMPLETED") {
                            netTime = `${att.netMinutes || 0} mins`;
                            breakTime = `${att.totalBreakMinutes || 0} mins`;
                        } else {
                            let bMs = 0;
                            if(att.breaks) {
                                att.breaks.forEach(b => {
                                    const end = b.end || (att.status === "ON_BREAK" ? Date.now() : b.start);
                                    bMs += (end - b.start);
                                });
                            }
                            const endRef = att.clockOut || Date.now();
                            const nMs = Math.max(0, (endRef - att.clockIn) - bMs);
                            
                            netTime = `${Math.floor(nMs / 60000)} mins (Live)`;
                            breakTime = `${Math.floor(bMs / 60000)} mins`;
                        }
                    }

                    const displayName = emp.name || emp.email || "Employee";
                    const displaySub = emp.employeeId || emp.email || "ID Not Set";

                    const card = document.createElement('div');
                    card.className = "emp-card";
                    if(statusClass !== "ABSENT") card.style.borderTopColor = "#2ecc71";

                    card.innerHTML = `
                        <h3>${displayName} <br><span style="font-size:12px; color:#aaa; font-weight:normal;">${displaySub}</span></h3>
                        <span class="status ${statusClass}">${status.replace("_", " ")}</span>
                        ${lateWarningHtml}
                        <hr>
                        <p>
                            <span><strong>Punch In:</strong> ${inTime}</span>
                            ${inLocHtml}
                        </p>
                        <p>
                            <span><strong>Punch Out:</strong> ${outTime}</span>
                            ${outLocHtml}
                        </p>
                        <hr style="border-top: 1px dashed #444;">
                        <p><span><strong>Net Worked:</strong> <span style="color:#2ecc71;">${netTime}</span></span></p>
                        <p><span><strong>Total Break:</strong> ${breakTime}</span></p>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                loading.innerText = "Error fetching data: " + error.message;
            }
        }
    </script>
</body>
</html>
